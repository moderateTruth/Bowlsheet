        body {

            background-color: #c6c6c6;
            margin: 20px auto 40px auto;
            padding: 23px;
            box-sizing: border-box;
        }

            height: auto;
            margin: 20px auto;
            background-color: #eeeeee;
            padding-bottom: 20px; /* UPDATED: Changed from 0px to 20px to add space beneath the next page button */
            position: relative;
        }
        .center-image {
            display: block;
            margin-left: auto;
            margin-right: auto;
            max-width: 100%;
            height: auto;
            padding-bottom: 10px;
        }
        /* Go Back link layout styling */
        .go-back-button {

            padding-top: 45px;
            padding-bottom: 20px; /* Added padding on the button itself to maintain clean look inside the frame */
            margin-left: 40px;
            font-size: 14px;
            color: #000000;
            text-decoration: none;
            font-weight: bold;
        }
        .go-back-button:hover {

            color: #00ff00;
